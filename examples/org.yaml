---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf: [guests]
---
# Repository owner account. Its name matches the GitHub username, so GitHub
# sign-in resolves to this entity.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: 0gis0
spec:
  profile:
    displayName: 0GiS0
  memberOf: [guests]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
spec:
  type: team
  children: []
